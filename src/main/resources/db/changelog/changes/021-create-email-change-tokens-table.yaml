databaseChangeLog:
  - changeSet:
      id: 021-create-email-change-tokens-table
      author: plishka-backend
      changes:
        - createTable:
            tableName: email_change_tokens
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    nullable: false
                    primaryKey: true
                    primaryKeyName: pk_email_change_tokens
              - column:
                  name: token_hash
                  type: VARCHAR(64)
                  constraints:
                    nullable: false
              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: new_email
                  type: VARCHAR(128)
                  constraints:
                    nullable: false
              - column:
                  name: expires_at
                  type: TIMESTAMP(6)
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP(6)
                  constraints:
                    nullable: false
        - addUniqueConstraint:
            tableName: email_change_tokens
            columnNames: token_hash
            constraintName: uk_email_change_tokens_token_hash
        - addUniqueConstraint:
            tableName: email_change_tokens
            columnNames: user_id
            constraintName: uk_email_change_tokens_user
        - addForeignKeyConstraint:
            baseTableName: email_change_tokens
            baseColumnNames: user_id
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_email_change_tokens_user
            onDelete: CASCADE
        - createIndex:
            tableName: email_change_tokens
            indexName: idx_email_change_tokens_expires_at
            columns:
              - column:
                  name: expires_at

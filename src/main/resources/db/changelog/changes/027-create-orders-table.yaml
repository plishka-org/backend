databaseChangeLog:
  - changeSet:
      id: PLIS-477-create-orders-table
      author: plishka-backend
      changes:
        - createTable:
            tableName: orders
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: order_number
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
              - column:
                  name: idempotency_key
                  type: VARCHAR(64)
                  constraints:
                    nullable: false
              - column:
                  name: request_hash
                  type: VARCHAR(64)
                  constraints:
                    nullable: false
              - column:
                  name: customer_name
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: total_price
                  type: DECIMAL(12,2)
                  constraints:
                    nullable: false
              - column:
                  name: delivery_city
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: phone
                  type: VARCHAR(13)
                  constraints:
                    nullable: false
              - column:
                  name: notes
                  type: TEXT
              - column:
                  name: created_at
                  type: TIMESTAMP(6)
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP(6)
                  constraints:
                    nullable: false
        - addUniqueConstraint:
            tableName: orders
            columnNames: order_number
            constraintName: uk_orders_order_number
        - addUniqueConstraint:
            tableName: orders
            columnNames: user_id, idempotency_key
            constraintName: uk_orders_user_id_idempotency_key
        - addForeignKeyConstraint:
            baseTableName: orders
            baseColumnNames: user_id
            constraintName: fk_orders_user
            referencedTableName: users
            referencedColumnNames: id
            onDelete: RESTRICT
        - createIndex:
            tableName: orders
            indexName: idx_orders_user_id_created_at_id
            columns:
              - column:
                  name: user_id
              - column:
                  name: created_at
                  descending: true
              - column:
                  name: id
                  descending: true
        - sql:
            sql: ALTER TABLE orders ADD CONSTRAINT chk_orders_total_price CHECK (total_price > 0);

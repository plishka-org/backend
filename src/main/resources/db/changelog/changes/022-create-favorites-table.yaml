databaseChangeLog:
  - changeSet:
      id: 022-create-favorites-table
      author: plishka-backend
      changes:
        - createTable:
            tableName: favorites
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    nullable: false
                    primaryKey: true
                    primaryKeyName: pk_favorites
              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: product_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP(6)
                  constraints:
                    nullable: false
        - addUniqueConstraint:
            tableName: favorites
            columnNames: user_id, product_id
            constraintName: uk_favorites_user_product
        - addForeignKeyConstraint:
            baseTableName: favorites
            baseColumnNames: user_id
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_favorites_user
            onDelete: CASCADE
        - createIndex:
            tableName: favorites
            indexName: idx_favorites_product_id
            columns:
              - column:
                  name: product_id
        - addForeignKeyConstraint:
            baseTableName: favorites
            baseColumnNames: product_id
            referencedTableName: products
            referencedColumnNames: id
            constraintName: fk_favorites_product
            onDelete: CASCADE
        - createIndex:
            tableName: favorites
            indexName: idx_favorites_user_created_at
            columns:
              - column:
                  name: user_id
              - column:
                  name: created_at
                  descending: true
              - column:
                  name: id
                  descending: true
